name: refresh-and-deploy
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: 'Automatic 10-minute chain run (not manual)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark start
        run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Refresh data and build
        id: build
        run: |
          cp data/overlap.json /tmp/overlap.bak
          if timeout 600 python3 data/refresh.py && timeout 120 python3 data/prices.py && timeout 60 python3 build.py && [ -s index.html.new ]; then
            n=$(grep -o '"cnt"' index.html.new | wc -l)
            echo "markets: $n"
            if [ "$n" -ge 5 ]; then mv index.html.new index.html; echo "ok=1" >> $GITHUB_OUTPUT
            else echo "Too few markets ($n), keeping old, skipping deploy"; rm -f index.html.new; cp /tmp/overlap.bak data/overlap.json; echo "ok=0" >> $GITHUB_OUTPUT; fi
          else echo "Refresh/build failed, keeping old"; rm -f index.html.new; cp /tmp/overlap.bak data/overlap.json; echo "ok=0" >> $GITHUB_OUTPUT; fi
      - name: Traders PnL (every ~6h)
        if: (github.event_name == 'workflow_dispatch' && !inputs.chain) || (steps.build.outputs.ok == '1')
        continue-on-error: true
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; } || { [ $((10#$H % 6)) -eq 0 ] && [ $((10#$M)) -lt 10 ]; }; then
            cp traders.json /tmp/traders.bak
            timeout 300 python3 mktraders.py || { echo "mktraders failed, keeping old"; cp /tmp/traders.bak traders.json; }
            python3 -c "import json;assert len(json.load(open('traders.json')))>0" || cp /tmp/traders.bak traders.json
            python3 build.py && [ "$(grep -o '"cnt"' index.html.new | wc -l)" -ge 5 ] && mv index.html.new index.html || rm -f index.html.new
          else echo "skip (not 6h slot)"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp index.html pub/index.html
          npx -y wrangler@4 pages deploy pub --project-name polyintel --branch main --commit-dirty=true
      - name: Commit data back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json traders.json index.html pub/index.html
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data refresh $(date -u '+%F %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Queue next run in ~10 min (GitHub cron is unreliable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 600 - ( $(date +%s) - T0 ) - 30 ))
          [ $left -gt 0 ] && sleep $left
          others=$(gh run list -R ${{ github.repository }} -w refresh.yml --json databaseId,status -q "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"pending\" or .status==\"waiting\") and .databaseId != ${{ github.run_id }})] | length")
          if [ "${others:-0}" -gt 0 ]; then echo "another run already queued, not chaining"; exit 0; fi
          gh workflow run refresh.yml -R ${{ github.repository }} --ref main -f chain=true
